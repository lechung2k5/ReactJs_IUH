
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Comparison</title>
</head>
<body>
    <h2>BMI Comparison Challenge</h2>
    <div id="output" style="font-family: Arial, sans-serif; padding: 20px; line-height: 1.8;"></div>
    <script>
        // 1. Tạo object cho Mark Miller
        const mark = {
            fullName: 'Mark Miller',
            mass: 78,
            height: 1.69,
            calcBMI: function() {
                this.bmi = this.mass / (this.height * this.height);
                return this.bmi;
            }
        };

        // 1. Tạo object cho John Smith
        const john = {
            fullName: 'John Smith',
            mass: 92,
            height: 1.95,
            calcBMI: function() {
                this.bmi = this.mass / (this.height * this.height);
                return this.bmi;
            }
        };

        // 2. Tính BMI cho cả hai
        mark.calcBMI();
        john.calcBMI();

        // 3. So sánh và log kết quả
        let result;
        if (mark.bmi > john.bmi) {
            result = `${mark.fullName}'s BMI (${mark.bmi.toFixed(1)}) is higher than ${john.fullName}'s (${john.bmi.toFixed(1)})!`;
        } else if (john.bmi > mark.bmi) {
            result = `${john.fullName}'s BMI (${john.bmi.toFixed(1)}) is higher than ${mark.fullName}'s (${mark.bmi.toFixed(1)})!`;
        } else {
            result = `${mark.fullName} and ${john.fullName} have the same BMI (${mark.bmi.toFixed(1)})!`;
        }

        console.log(result);
        
        // Hiển thị kết quả trên trang
        const outputDiv = document.getElementById('output');
        outputDiv.innerHTML = `
            <h3>Kết quả:</h3>
            <p><strong>${mark.fullName}:</strong> BMI = ${mark.bmi.toFixed(2)}</p>
            <p><strong>${john.fullName}:</strong> BMI = ${john.bmi.toFixed(2)}</p>
            <p style="font-size: 18px; color: #d32f2f; font-weight: bold;">${result}</p>
        `;
    </script>
</body>
</html>
