<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="">Tổng bill</label>
    <input type="text" id = "priceBill" >
    <input type="button" value="Tính tip" style="width: 100px;" id="btnResult" onclick="btnResult()">
    <label for="">% tip</label>
    <input type="text" id="percent" disabled>
    <label for="">Tiền tip:</label>
    <input type="text" id="result" disabled>
    <label for="">Số tiền phải trả:</label>
    <input type="text" id="total" disabled>
    <script>
        
        function btnResult() {
            var bill = Number(document.getElementById("priceBill").value);
            var percentValue = (bill >= 50 && bill <= 300) ? 15 : 20;
            var tip = bill * (percentValue / 100);
            var total = bill + tip;
            document.getElementById("percent").value = percentValue + "%";
            document.getElementById("result").value = tip.toFixed(2);
            document.getElementById("total").value = total.toFixed(2);
            console.log(`The bill was ${bill}, the tip was ${tip.toFixed(2)}, and the total value ${total.toFixed(2)}`);
        }
         
    </script>
</body>
</html>
