<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function & Chaining Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        #output {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            border: 2px solid #ddd;
            max-width: 800px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Arrow Function & Method Chaining - Dog Age Conversion</h2>
    <div id="output"></div>
    <script>
        const outputDiv = document.getElementById('output');
        let logOutput = '';
        
        const originalLog = console.log;
        console.log = function(...args) {
            logOutput += args.join(' ') + '\n';
            originalLog.apply(console, args);
        };
        
        const calcAverageHumanAge = (ages) => {
            return ages
                .map(dogAge => dogAge <= 2 ? 2 * dogAge : 16 + dogAge * 4)
                .filter(humanAge => humanAge >= 18)
                .reduce((acc, age, index, arr) => acc + age / arr.length, 0);
        };
        
        console.log('=== TEST DATA 1 ===');
        const avg1 = calcAverageHumanAge([5, 2, 4, 1, 15, 8, 3]);
        console.log(`Average human age: ${avg1.toFixed(2)}`);
        
        console.log('\n=== TEST DATA 2 ===');
        const avg2 = calcAverageHumanAge([16, 6, 10, 5, 6, 1, 4]);
        console.log(`Average human age: ${avg2.toFixed(2)}`);
        
        outputDiv.textContent = logOutput;
    </script>
</body>
</html>
