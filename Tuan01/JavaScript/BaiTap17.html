<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogs Study Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        #output {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            border: 2px solid #ddd;
            max-width: 800px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Dogs Study - Julia and Kate</h2>
    <div id="output"></div>
    <script>
        const outputDiv = document.getElementById('output');
        let logOutput = '';
        
        const originalLog = console.log;
        console.log = function(...args) {
            logOutput += args.join(' ') + '\n';
            originalLog.apply(console, args);
        };
        
        function checkDogs(dogsJulia, dogsKate) {
            const juliaCorrected = dogsJulia.slice(1, -2);
            const allDogs = [...juliaCorrected, ...dogsKate];
            
            allDogs.forEach(function(age, index) {
                const dogNumber = index + 1;
                if (age >= 3) {
                    console.log(`Dog number ${dogNumber} is an adult, and is ${age} years old`);
                } else {
                    console.log(`Dog number ${dogNumber} is still a puppy 🐶`);
                }
            });
        }
        
        console.log('=== TEST DATA 1 ===');
        checkDogs([3, 5, 2, 12, 7], [4, 1, 15, 8, 3]);
        
        console.log('\n=== TEST DATA 2 ===');
        checkDogs([9, 16, 6, 8, 3], [10, 5, 6, 1, 4]);
        
        outputDiv.textContent = logOutput;
    </script>
</body>
</html>
