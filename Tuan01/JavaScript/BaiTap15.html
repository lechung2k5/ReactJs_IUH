<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        #results {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            border: 2px solid #ddd;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <h2>Simple Poll App</h2>
    <button id="answerPoll">Answer poll</button>
    <div id="results"></div>
    <script>
        const poll = {
            question: "What is your favourite programming language?",
            options: ["0: JavaScript", "1: Python", "2: Rust", "3: C++"],
            answers: new Array(4).fill(0),
            
            registerNewAnswer: function() {
                const promptMessage = `${this.question}\n${this.options.join('\n')}\n(Write option number)`;
                const answer = prompt(promptMessage);
                
                const answerNumber = Number(answer);
                
                if (typeof answerNumber === 'number' && !isNaN(answerNumber) && 
                    answerNumber >= 0 && answerNumber < this.answers.length) {
                    this.answers[answerNumber]++;
                } else {
                    alert('Invalid input! Please enter a valid option number.');
                    return;
                }
                
                this.displayResults('array');
            },
            
            displayResults: function(type = 'array') {
                if (type === 'array') {
                    console.log(this.answers);
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `<h3>Poll Results (Array):</h3><pre>${JSON.stringify(this.answers, null, 2)}</pre>`;
                } else if (type === 'string') {
                    const resultString = `Poll results are ${this.answers.join(', ')}`;
                    console.log(resultString);
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `<h3>Poll Results (String):</h3><p>${resultString}</p>`;
                }
            }
        };
        
        document.getElementById('answerPoll').addEventListener('click', function() {
            poll.registerNewAnswer();
        });
        
        poll.displayResults.call({answers: [5, 2, 3]}, 'array');
        poll.displayResults.call({answers: [5, 2, 3]}, 'string');
        
        poll.displayResults.call({answers: [1, 5, 3, 9, 6, 1]}, 'array');
        poll.displayResults.call({answers: [1, 5, 3, 9, 6, 1]}, 'string');
    </script>
</body>
</html>
