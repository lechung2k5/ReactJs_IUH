<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog to Human Age Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        #output {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            border: 2px solid #ddd;
            max-width: 800px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Dog to Human Age Conversion - Julia and Kate</h2>
    <div id="output"></div>
    <script>
        const outputDiv = document.getElementById('output');
        let logOutput = '';
        
        const originalLog = console.log;
        console.log = function(...args) {
            logOutput += args.join(' ') + '\n';
            originalLog.apply(console, args);
        };
        
        function calcAverageHumanAge(ages) {
            const humanAges = ages.map(function(dogAge) {
                if (dogAge <= 2) {
                    return 2 * dogAge;
                } else {
                    return 16 + dogAge * 4;
                }
            });
            
            const adultDogs = humanAges.filter(function(humanAge) {
                return humanAge >= 18;
            });
            
            const average = adultDogs.reduce(function(acc, age, index, arr) {
                return acc + age / arr.length;
            }, 0);
            
            return average;
        }
        
        console.log('=== TEST DATA 1 ===');
        const avg1 = calcAverageHumanAge([5, 2, 4, 1, 15, 8, 3]);
        console.log(`Average human age: ${avg1.toFixed(2)}`);
        
        console.log('\n=== TEST DATA 2 ===');
        const avg2 = calcAverageHumanAge([16, 6, 10, 5, 6, 1, 4]);
        console.log(`Average human age: ${avg2.toFixed(2)}`);
        
        outputDiv.textContent = logOutput;
    </script>
</body>
</html>
