<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Soccer</title>
</head>
<body style="background-color: #222; color: #fff; font-family: sans-serif; padding: 20px;">
    <h2>Football Betting Dashboard </h2>
    <div id = "ui-output" style="background: #333; padding: 15px; border-radius: 8px; line-height: 1.6;">

    </div>

    <script>
        const game = {
            team1: 'Bayern Munich',
            team2: 'Borrussia Dortmund',
            players: [
                ['Neuer', 'Pavard', 'Martinez', 'Alaba', 'Davies', 'Kimmich', 'Goretzka', 'Coman', 'Muller', 'Gnarby', 'Lewandowski'],
                ['Burki', 'Schulz', 'Hummels', 'Akanji', 'Hakimi', 'Weigl', 'Witsel', 'Hazard', 'Brandt', 'Sancho', 'Gotze'],
            ],
            score: '4:0',
            scored: ['Lewandowski', 'Gnarby', 'Lewandowski', 'Hummels'],
            date: 'Nov 9th, 2037',
            odds: { team1: 1.33, x: 3.25, team2: 6.5 },
        }
        const display = (text) => {
            document.getElementById('ui-output').innerHTML += `<p>${text}</p>`;
        }

        const [players1, players2] = game.players;
        const [gk, ...fieldPlayers] = players1; //... (Rest) ở đây đóng vai trò gom tất cả những người còn dư vào một mảng mới tên là fieldPlayers.
        const allPlayers = [...players1, ...players2];
        const players1Final = [...players1, 'Thiago', 'Coutinho', 'Perisic'];
        const { odds: { team1: odd1, x: draw, team2: odd2 } } = game;
        display(`Trận đấu: <b>${game.team1} vs ${game.team2}</b>`);
        for (const [i, player] of game.scored.entries()) {
            const goalMsg = `Goal ${i + 1}: ${player}`;
            console.log(goalMsg);
            display(goalMsg);
  
        }
        
        
        const oddsValues = Object.values(game.odds);
        let average = 0;
        for (const odd of oddsValues){
            average += odd;
        }
        average /= oddsValues.length;
        const scorers = {};
        for (const player of game.scored) {
            scorers[player] = (scorers[player] || 0) + 1;
        }
        console.log(scorers);
        let scorersMsg = 'Số lượng bàn thắng:<br>';
        for (const player in scorers) {
            scorersMsg += `- ${player}: <b>${scorers[player]}</b><br>`;
        }
        display(scorersMsg);
        display(`<b>Tỉ lệ cược trung bình:</b> ${average.toFixed(2)}`);
        console.log(`Average odd: ${average.toFixed(2)}`);
        const winText = (odd1 < odd2 && odd1 < draw && `${game.team1} thắng`) ||
                (odd2 < odd1 && odd2 < draw && `${game.team2} thắng`) ||
                "Hòa";

            display(`Dự đoán: <b>${winText}</b>`);

    </script>
</body>
</html>
